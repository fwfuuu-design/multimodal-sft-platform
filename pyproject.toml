# Modified in 2026 for the Multimodal Fine-tuning Platform MVP.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-sft-platform"
dynamic = ["version"]
description = "Authenticated platform for text and image-text SFT with LoRA and 4-bit QLoRA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.0"
keywords = ["SFT", "LoRA", "QLoRA", "multimodal", "fine-tuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.55.0,<=5.8.0,!=4.57.0,!=5.6.0",
    "datasets>=2.16.0,<=4.0.0",
    "accelerate>=1.3.0,<=1.11.0",
    "peft>=0.18.0,<=0.18.1",
    "gradio>=4.38.0,<=5.50.0",
    "matplotlib>=3.7.0",
    "numpy",
    "pillow",
    "sentencepiece",
    "tiktoken",
    "modelscope",
    "hf-transfer",
    "safetensors",
    "nltk",
    "jieba",
    "rouge-chinese",
    "omegaconf",
    "packaging",
    "protobuf",
    "pyyaml",
    "pydantic",
    "cryptography>=42.0.0",
    "httpx",
    "uvicorn",
    "fastapi",
]

[project.scripts]
sft-train = "sft_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_platform"]

[tool.hatch.version]
path = "src/sft_platform/extras/env.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.ruff]
target-version = "py311"
line-length = 119
indent-width = 4

[tool.ruff.lint]
ignore = [
    "C408",  # collection
    "C901",  # complex
    "E501",  # line too long
    "E731",  # lambda function
    "E741",  # ambiguous var name
    "UP007", # no upgrade union
    "UP045", # no upgrade optional
    "D100",  # no doc public module
    "D101",  # no doc public class
    "D102",  # no doc public method
    "D103",  # no doc public function
    "D104",  # no doc public package
    "D105",  # no doc magic method
    "D107",  # no doc __init__
]
select = [
    "C",      # complexity
    "E",      # error
    "F",      # pyflakes
    "I",      # isort
    "W",      # warning
    "UP",     # pyupgrade
    "D",      # pydocstyle
    "PT009",  # pytest assert
    "RUF022", # sort __all__
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["sft_platform"]
known-third-party = [
    "accelerate",
    "datasets",
    "gradio",
    "numpy",
    "peft",
    "torch",
    "transformers",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"
